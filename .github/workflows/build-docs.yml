name: Build and publish documentation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Validate and build website
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SITE_URL: ${{ vars.PAGES_CUSTOM_DOMAIN && format('https://{0}', vars.PAGES_CUSTOM_DOMAIN) || 'https://dshanpi.github.io' }}
      BASE_URL: ${{ vars.PAGES_CUSTOM_DOMAIN && '/' || '/edgeaccel-docs/' }}
      NODE_OPTIONS: --max-old-space-size=4096
      PAGES_ATTACHMENT_REVISION: ${{ github.sha }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test first-inference script
        run: python3 scripts/test-first-inference.py

      - name: Test Pages asset preparation
        run: |
          python3 scripts/test-prepare-pages.py
          node --test scripts/test-pages-attachments.cjs

      # prebuild regenerates the guides and validates model records and links.
      - name: Build documentation
        run: npm run build:low-memory

      - name: Prepare website for GitHub Pages
        run: python3 scripts/prepare-pages.py build

      - name: Upload website artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: edgeaccel-docs-site
          path: build/
          if-no-files-found: error
          retention-days: 7
          compression-level: 1

  publish:
    name: Publish gh-pages branch
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download website artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: edgeaccel-docs-site
          path: build

      - name: Publish compiled website
        uses: peaceiris/actions-gh-pages@329bcc8f12caed2cefe5a5b80781499a6f3b361b # v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./build
          cname: ${{ vars.PAGES_CUSTOM_DOMAIN }}
