    <style>text{font-family:'Microsoft YaHei','Noto Sans SC',sans-serif}.label{fill:#253957;font-size:22px;font-weight:600}.sub{fill:#51677f;font-size:18px}.chip{fill:#f4f8ff;font-size:22px;font-weight:600}.note{fill:#c0d8df;font-size:17px}.line{fill:none;stroke:#7895a7;stroke-width:2}</style>
  </defs>
